name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Composed (not canned test-system.yml): cl-oci-client depends on
# http-protocol, so `asdf:load-system "cl-repository-client"` resolves
# this checkout before `ensure-system-dependencies`. Preinstall
# encoding-protocol with the checkout off the registry first.
permissions:
  contents: read
  packages: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    container: ${{ (startsWith(matrix.os, 'ubuntu') && 'ghcr.io/egao1980/cl-repository/ci-base:latest') || fromJSON('null') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          version: latest
          sbcl-version: "2.6.7"

      - name: Preinstall encoding-protocol
        run: |
          set -euo pipefail
          orig="${CL_SOURCE_REGISTRY:-}"
          client="${CL_REPOSITORY_CLIENT_DIR:-${CL_REPOSITORY_DEST:-}}"
          sys="${HOME}/.local/share/cl-repository/systems"
          mkdir -p "${sys}"
          sep=":"
          if command -v cygpath >/dev/null 2>&1; then
            sep=";"
            sys="$(cygpath -m "${sys}")"
            client="$(cygpath -m "${client}")"
          fi
          export CL_SOURCE_REGISTRY="${client}//${sep}${sys}//${sep}"
          ros -e "(sb-ext:disable-debugger)" \
              -e '(asdf:load-system "cl-repository-client")' \
              -e '(cl-repo:add-registry "https://ghcr.io" :namespace "egao1980/cl-systems" :priority :prepend)' \
              -e '(cl-repo:ensure-systems "encoding-protocol" :default-source :oci)' \
              -q
          printf 'CL_SOURCE_REGISTRY=%s%s//%s\n' "${orig}" "${sys}" "${sep}" >> "${GITHUB_ENV}"

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
